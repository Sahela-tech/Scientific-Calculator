<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="screen" placeholder="0" readonly>
        </div>
        <div class="buttons">
            <button class="btn btn-action" onclick="clearDisplay()">AC</button>
            <button class="btn btn-action" onclick="deleteChar()">DEL</button>
            <button class="btn btn-sci" onclick="appendValue('(')">(</button>
            <button class="btn btn-sci" onclick="appendValue(')')">)</button>

            <button class="btn btn-sci" onclick="appendFunction('sin(')">sin</button>
            <button class="btn btn-sci" onclick="appendFunction('cos(')">cos</button>
            <button class="btn btn-sci" onclick="appendFunction('tan(')">tan</button>
            <button class="btn btn-op" onclick="appendValue('/')">&divide;</button>

            <button class="btn btn-sci" onclick="appendFunction('log(')">log</button>
            <button class="btn btn-sci" onclick="appendFunction('sqrt(')">&radic;</button>
            <button class="btn btn-sci" onclick="appendValue('**')">x<sup>y</sup></button>

            <button class="btn btn-op" onclick="appendValue('*')">&times;</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn btn-op" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn btn-op" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn btn-sci" onclick="appendValue('Math.PI')">&pi;</button>

            <button class="btn" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn btn-sci" onclick="appendValue('Math.E')">e</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
